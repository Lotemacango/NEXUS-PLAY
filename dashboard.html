<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEXUS PLAY | Control Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--para mais informações entre em contacto 931471731---------lote by-->

    <header class="header">
        <div class="container">
            <div class="navbar">
                <div class="logo">
                    <h1>⚡ NEXUS PLAY</h1>
                    <p>CONTROL PANEL — Gestão de Dados</p>
                </div>
                <div style="flex: 1;"></div>
                <div class="navbar-right" style="display: flex; gap: 20px; align-items: center;">
                    <span id="userDisplay" style="color: #00f2fe; font-weight: 600;"></span>
                    <button id="logoutBtn" class="btn-primary btn-ghost" type="button" title="Sair da sessão">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <section id="gestao" class="private-dashboard active">
            <div class="container">
                <div class="dashboard-header">
                    <h2><i class="fas fa-tachometer-alt"></i> Nexus Control - <span id="userRoleDisplay"></span></h2>
                </div>
                <div id="dashboardTabs" class="admin-tabs"></div>
                <div id="dashboardContents"></div>
                <div id="adminSpecial" class="admin-special"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Nexus Play — Dashboard Privado. Gerenciamento de Dados Administrativo.</p>
        </div>
    </footer>

    <script src="app-dashboard.js" defer></script>
</body>
</html>
